<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신우코맥스 로고 샘플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #ffffff; --bg-soft: #f4f7fa; --ink: #13202e; --ink-soft: #566577; --line: #e1e7ed; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Pretendard", system-ui, sans-serif; background: var(--bg-soft); color: var(--ink); line-height: 1.6; word-break: keep-all; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 44px 20px 80px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .lead { color: var(--ink-soft); margin-top: 6px; max-width: 820px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 28px; height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--a) 50%, var(--b) 50%); }

  .grid { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .s { --h: #ffffff; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; }
  .s .top { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; padding: 26px 22px 20px; }
  .s .big { width: 120px; height: 120px; }
  .s h2 { font-size: 17px; font-weight: 700; }
  .s h2 b { color: var(--c1); margin-right: 6px; }
  .s p { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .lock { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-top: 1px solid var(--line); }
  .lock svg { width: 46px; height: 46px; flex: none; }
  .lock .nm { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; color: var(--ink); }
  .lock .tg { font-size: 11.5px; font-weight: 500; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; }
  .uses { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 0 22px 22px; align-items: center; }
  .rev { --h: var(--base); --c1: #ffffff; background: var(--base); border-radius: 12px; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #fff; }
  .rev svg { width: 30px; height: 30px; flex: none; }
  .rev b { font-size: 17px; letter-spacing: -0.03em; }
  .icon { width: 54px; height: 54px; border-radius: 14px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }
  .icon svg { width: 38px; height: 38px; }
  .note { margin-top: 28px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 1 기본 다듬기 -->
    <symbol id="d1" viewBox="0 0 100 100">
      <rect x="22" y="8" width="56" height="84" rx="10" fill="none" style="stroke:var(--c1)" stroke-width="9"/>
      <path d="M36 19 L66 26 V82 L36 89 Z" style="fill:var(--c2)" stroke-linejoin="round"/>
      <circle cx="58" cy="56" r="4.5" style="fill:var(--h)"/>
    </symbol>
    <!-- 2 문 + 빛 -->
    <symbol id="d2" viewBox="0 0 100 100">
      <rect x="22" y="6" width="56" height="78" rx="9" fill="none" style="stroke:var(--c1)" stroke-width="9"/>
      <path d="M31 15 H69 V75 H31 Z" style="fill:var(--c2)"/>
      <path d="M31 15 L52 21 V81 L31 75 Z" style="fill:var(--c1)"/>
      <path d="M31 84 H69 L86 96 H14 Z" style="fill:var(--c2)" opacity=".55"/>
      <circle cx="46" cy="49" r="3.8" style="fill:var(--h)"/>
    </symbol>
    <!-- 3 아치 문 -->
    <symbol id="d3" viewBox="0 0 100 100">
      <path d="M22 92 V38 A28 28 0 0 1 78 38 V92 Z" fill="none" style="stroke:var(--c1)" stroke-width="9" stroke-linejoin="round"/>
      <path d="M37 87 V46 A13 13 0 0 1 52 33 L64 37 V82 Z" style="fill:var(--c2)"/>
      <circle cx="58" cy="58" r="4.5" style="fill:var(--h)"/>
    </symbol>
    <!-- 4 입체 문짝 -->
    <symbol id="d4" viewBox="0 0 100 100">
      <rect x="20" y="7" width="60" height="86" rx="10" fill="none" style="stroke:var(--c1)" stroke-width="10"/>
      <path d="M34 18 L64 26 V83 L34 90 Z" style="fill:var(--c2)"/>
      <path d="M64 26 L70 24 V85 L64 83 Z" style="fill:var(--c1)" opacity=".85"/>
      <circle cx="56" cy="56" r="4.5" style="fill:var(--h)"/>
    </symbol>
    <!-- 5 타일 안 문 -->
    <symbol id="d5" viewBox="0 0 100 100">
      <rect x="4" y="4" width="92" height="92" rx="24" style="fill:var(--c1)"/>
      <rect x="29" y="17" width="42" height="66" rx="7" fill="none" style="stroke:var(--h)" stroke-width="7"/>
      <path d="M38 25 L62 31 V75 L38 81 Z" style="fill:var(--c2)"/>
      <circle cx="56" cy="53" r="3.5" style="fill:var(--h)"/>
    </symbol>
    <!-- 6 문 + 열쇠구멍 -->
    <symbol id="d6" viewBox="0 0 100 100">
      <rect x="22" y="8" width="56" height="84" rx="10" fill="none" style="stroke:var(--c1)" stroke-width="9"/>
      <path d="M36 19 L66 26 V82 L36 89 Z" style="fill:var(--c2)"/>
      <circle cx="51" cy="50" r="5.5" style="fill:var(--h)"/>
      <path d="M48 53 H54 L55.5 66 H46.5 Z" style="fill:var(--h)"/>
    </symbol>
    <!-- 7 문 + 출입통제기 -->
    <symbol id="d7" viewBox="0 0 100 100">
      <rect x="8" y="8" width="54" height="84" rx="10" fill="none" style="stroke:var(--c1)" stroke-width="9"/>
      <path d="M21 19 L50 26 V82 L21 89 Z" style="fill:var(--c2)"/>
      <circle cx="43" cy="56" r="4.2" style="fill:var(--h)"/>
      <rect x="72" y="40" width="20" height="30" rx="6" style="fill:var(--c1)"/>
      <circle cx="82" cy="50" r="4" style="fill:var(--c2)"/>
      <rect x="77" y="58" width="10" height="4" rx="2" style="fill:var(--h)"/>
    </symbol>
    <!-- 8 선형 미니멀 -->
    <symbol id="d8" viewBox="0 0 100 100">
      <rect x="22" y="8" width="56" height="84" rx="10" fill="none" style="stroke:var(--c1)" stroke-width="8"/>
      <path d="M38 20 L64 27 V81 L38 88 Z" fill="none" style="stroke:var(--c2)" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="56" cy="55" r="4.5" style="fill:var(--c2)"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <h1>신우코맥스 로고 샘플 · 열린 문 다듬기 <span style="font-size:15px;color:#0b5cad">→ 6번 확정</span></h1>
  <p class="lead">2차 샘플 1번 <b>열린 문</b>을 바탕으로 비율·모양·의미를 바꿔 본 8가지입니다. 색은 블루(#0b5cad) + 청록(#16b3a0) 투톤입니다.</p>

  <div class="grid" id="grid"></div>
  <p class="note">※ 샘플입니다. 고르시면 다듬어서 SVG·PNG 파일로 만듭니다. 코맥스 본사 로고·상표 디자인은 쓰지 않았습니다.</p>
</div>

<script>
  // 샘플 목록: [심볼 id, 이름, 설명, 메인색, 포인트색]
  var S = [
    ["d1", "기본 다듬기", "2차 1번을 정리한 안. 문틀 모서리를 둥글게, 문짝 비율을 바로잡았습니다.", "#0b5cad", "#16b3a0"],
    ["d2", "문 + 빛", "문이 열리며 청록 빛이 새어 나오는 모습. \"새 공간을 열어 준다\"는 느낌입니다.", "#0b5cad", "#16b3a0"],
    ["d3", "아치 문", "윗부분을 둥근 아치로. 부드럽고 친근한 인상, 주거 공간에 어울립니다.", "#0b5cad", "#16b3a0"],
    ["d4", "입체 문짝", "문짝 옆면에 두께를 넣어 입체감을 살렸습니다. 간판에서 존재감이 큽니다.", "#0b5cad", "#16b3a0"],
    ["d5", "타일 안 문", "파란 타일 안에 흰 문틀. 앱 아이콘·프로필·스티커로 바로 쓰기 좋습니다.", "#0b5cad", "#16b3a0"],
    ["d6", "문 + 열쇠구멍", "문짝에 열쇠구멍. 출입통제·도어락 시공을 가장 분명하게 보여 줍니다.", "#0b5cad", "#16b3a0"],
    ["d7", "문 + 출입통제기", "문 옆 벽에 카드리더기. 출입통제 시스템 회사라는 점을 구체적으로 표현합니다.", "#0b5cad", "#16b3a0"],
    ["d8", "선형 미니멀", "면 대신 선으로만. 가볍고 세련된 느낌, 인쇄·자수(작업복)에도 깔끔합니다.", "#0b5cad", "#16b3a0"]
  ];
  var TAG = "출입통제 · 홈네트워크 · CCTV 시공 전문";
  var html = S.map(function (s, i) {
    var u = '<use href="#' + s[0] + '"/>';
    return '<article class="s" style="--c1:' + s[3] + ';--c2:' + s[4] + ';--base:' + s[3] + '">' +
      '<div class="top"><svg class="big" viewBox="0 0 100 100">' + u + '</svg>' +
      '<div><h2><b>' + (i + 1) + '</b>' + s[1] + '</h2><p>' + s[2] + '</p></div></div>' +
      '<div class="lock"><svg viewBox="0 0 100 100">' + u + '</svg><div><div class="nm">신우코맥스</div><div class="tg">' + TAG + '</div></div></div>' +
      '<div class="uses"><div class="rev"><svg viewBox="0 0 100 100">' + u + '</svg><b>신우코맥스</b></div>' +
      '<div class="icon"><svg viewBox="0 0 100 100">' + u + '</svg></div></div>' +
      '</article>';
  }).join("");
  document.getElementById("grid").innerHTML = html;
</script>
</body>
</html>
