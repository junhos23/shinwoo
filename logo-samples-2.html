<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신우코맥스 로고 샘플 2차</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #ffffff; --bg-soft: #f4f7fa; --ink: #13202e; --ink-soft: #566577; --line: #e1e7ed; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Pretendard", system-ui, sans-serif; background: var(--bg-soft); color: var(--ink); line-height: 1.6; word-break: keep-all; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 44px 20px 80px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .lead { color: var(--ink-soft); margin-top: 6px; max-width: 820px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 28px; height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--a) 50%, var(--b) 50%); }

  .grid { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .s { --h: #ffffff; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; }
  .s .top { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; padding: 26px 22px 20px; }
  .s .big { width: 120px; height: 120px; }
  .s h2 { font-size: 17px; font-weight: 700; }
  .s h2 b { color: var(--c1); margin-right: 6px; }
  .s p { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .lock { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-top: 1px solid var(--line); }
  .lock svg { width: 46px; height: 46px; flex: none; }
  .lock .nm { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; color: var(--ink); }
  .lock .tg { font-size: 11.5px; font-weight: 500; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; }
  .uses { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 0 22px 22px; align-items: center; }
  .rev { --h: var(--base); --c1: #ffffff; background: var(--base); border-radius: 12px; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #fff; }
  .rev svg { width: 30px; height: 30px; flex: none; }
  .rev b { font-size: 17px; letter-spacing: -0.03em; }
  .icon { width: 54px; height: 54px; border-radius: 14px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; }
  .icon svg { width: 38px; height: 38px; }
  .note { margin-top: 28px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- A 문 -->
    <symbol id="a" viewBox="0 0 100 100">
      <rect x="22" y="8" width="56" height="84" rx="9" fill="none" style="stroke:var(--c1)" stroke-width="9"/>
      <path d="M37 20 L67 28 V80 L37 88 Z" style="fill:var(--c2)"/>
      <circle cx="59" cy="55" r="4.5" style="fill:var(--h)"/>
    </symbol>
    <!-- B 문 + 신호 -->
    <symbol id="b" viewBox="0 0 100 100">
      <rect x="8" y="14" width="44" height="76" rx="8" fill="none" style="stroke:var(--c1)" stroke-width="8"/>
      <path d="M20 24 L44 31 V74 L20 81 Z" style="fill:var(--c1)"/>
      <circle cx="38" cy="53" r="3.8" style="fill:var(--h)"/>
      <path d="M64 41 A16 16 0 0 1 64 65" fill="none" style="stroke:var(--c2)" stroke-width="7" stroke-linecap="round"/>
      <path d="M74 31 A30 30 0 0 1 74 75" fill="none" style="stroke:var(--c2)" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <!-- C 집 + 신호 -->
    <symbol id="c" viewBox="0 0 100 100">
      <path d="M10 47 L50 13 L90 47" fill="none" style="stroke:var(--c1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 41 V88 H80 V41" fill="none" style="stroke:var(--c1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="50" cy="77" r="4.5" style="fill:var(--c2)"/>
      <path d="M40 70 A11 11 0 0 1 60 70" fill="none" style="stroke:var(--c2)" stroke-width="6" stroke-linecap="round"/>
      <path d="M31 62 A23 23 0 0 1 69 62" fill="none" style="stroke:var(--c2)" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <!-- D 집 + 문 -->
    <symbol id="d" viewBox="0 0 100 100">
      <path d="M10 47 L50 13 L90 47" fill="none" style="stroke:var(--c1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 41 V88 H80 V41" fill="none" style="stroke:var(--c1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 54 L62 59 V88 H40 Z" style="fill:var(--c2)"/>
      <circle cx="56" cy="73" r="3.5" style="fill:var(--h)"/>
    </symbol>
    <!-- E 방패 + 집 -->
    <symbol id="e" viewBox="0 0 100 100">
      <path d="M50 5 L87 18 V46 C87 72 71 87 50 95 C29 87 13 72 13 46 V18 Z" style="fill:var(--c1)"/>
      <path d="M28 52 L50 33 L72 52 V74 H28 Z" style="fill:var(--h)"/>
      <rect x="43" y="57" width="14" height="17" rx="2" style="fill:var(--c2)"/>
    </symbol>
    <!-- F 방패 + 신호 -->
    <symbol id="f" viewBox="0 0 100 100">
      <path d="M50 5 L87 18 V46 C87 72 71 87 50 95 C29 87 13 72 13 46 V18 Z" style="fill:var(--c1)"/>
      <circle cx="50" cy="66" r="5.5" style="fill:var(--c2)"/>
      <path d="M37 60 A14 14 0 0 1 63 60" fill="none" style="stroke:var(--h)" stroke-width="7" stroke-linecap="round"/>
      <path d="M27 50 A27 27 0 0 1 73 50" fill="none" style="stroke:var(--h)" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <!-- G 투톤 방패 + 문 -->
    <symbol id="g" viewBox="0 0 100 100">
      <path d="M50 5 L87 18 V46 C87 72 71 87 50 95 C29 87 13 72 13 46 V18 Z" style="fill:var(--c1)"/>
      <path d="M50 5 L87 18 V46 C87 72 71 87 50 95 Z" style="fill:var(--c2)"/>
      <path d="M39 74 V45 A11 11 0 0 1 61 45 V74 Z" style="fill:var(--h)"/>
      <circle cx="55" cy="59" r="3.5" style="fill:var(--c1)"/>
    </symbol>
    <!-- H 지붕 방패 + 신호 -->
    <symbol id="h" viewBox="0 0 100 100">
      <path d="M50 5 L89 33 V52 C89 75 72 88 50 96 C28 88 11 75 11 52 V33 Z" style="fill:var(--c1)"/>
      <circle cx="50" cy="70" r="5.5" style="fill:var(--c2)"/>
      <path d="M37 63 A14 14 0 0 1 63 63" fill="none" style="stroke:var(--h)" stroke-width="7" stroke-linecap="round"/>
      <path d="M27 53 A27 27 0 0 1 73 53" fill="none" style="stroke:var(--h)" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <!-- I 집 모양 문 -->
    <symbol id="i" viewBox="0 0 100 100">
      <path d="M24 92 V40 L50 16 L76 40 V92" fill="none" style="stroke:var(--c1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 44 L50 32 L64 44 V92 H36 Z" style="fill:var(--c2)"/>
      <circle cx="57" cy="66" r="4" style="fill:var(--h)"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <h1>신우코맥스 로고·심볼 샘플 2차 (문·집·방패 · 블루+청록 투톤)</h1>
  <p class="lead">1차 샘플 중 마음에 드신 3번(열린 문)·4번(집 + 신호)·6번(방패 + 집)을 다듬고 서로 조합했습니다. 색은 3·7번처럼 <b>블루 + 청록 투톤</b>으로 통일했습니다.</p>

  <div class="grid" id="grid"></div>
  <p class="note">※ 샘플입니다. 고르시면 다듬어서 SVG·PNG 파일로 만듭니다. 코맥스 본사 로고·상표 디자인은 쓰지 않았습니다.</p>
</div>

<script>
  // 샘플 목록: [심볼 id, 이름, 설명, 메인색, 포인트색]
  var S = [
    ["a", "열린 문", "3번을 다듬은 안. 파란 문틀 안에 청록 문짝이 열린 모습. 출입통제 회사라는 게 가장 직관적입니다.", "#0b5cad", "#16b3a0"],
    ["b", "문 + 신호", "열린 문에서 신호가 퍼져 나가는 모습. 출입통제와 네트워크를 함께 담았습니다.", "#0b5cad", "#16b3a0"],
    ["c", "집 + 신호", "4번을 다듬은 안. 파란 집 안에 청록 와이파이. 홈네트워크·월패드에 가장 잘 맞습니다.", "#0b5cad", "#16b3a0"],
    ["d", "집 + 문", "집 안에 청록 문이 열린 모습. 홈네트워크와 출입통제를 한 그림에 담았습니다.", "#0b5cad", "#16b3a0"],
    ["e", "방패 + 집", "6번을 다듬은 안. 방패가 집을 지키는 모습. 가장 믿음직한 보안 업체형입니다.", "#0b5cad", "#16b3a0"],
    ["f", "방패 + 신호", "방패 안에 신호. 보안과 홈네트워크·CCTV 연결을 함께 표현합니다.", "#0b5cad", "#16b3a0"],
    ["g", "투톤 방패 + 문", "방패 반쪽을 청록으로 나누고 가운데 문. 투톤이 가장 뚜렷한 안입니다.", "#0b5cad", "#16b3a0"],
    ["h", "지붕 방패 + 신호", "위쪽을 지붕처럼 뾰족하게 만든 방패. 집·보안·신호 세 가지를 한 번에 담았습니다.", "#0b5cad", "#16b3a0"],
    ["i", "집 모양 문", "지붕이 있는 문틀에 청록 문. 3번과 4번을 합친 단순한 안입니다.", "#0b5cad", "#16b3a0"]
  ];
  var TAG = "출입통제 · 홈네트워크 · CCTV 시공 전문";
  var html = S.map(function (s, i) {
    var u = '<use href="#' + s[0] + '"/>';
    return '<article class="s" style="--c1:' + s[3] + ';--c2:' + s[4] + ';--base:' + s[3] + '">' +
      '<div class="top"><svg class="big" viewBox="0 0 100 100">' + u + '</svg>' +
      '<div><h2><b>' + (i + 1) + '</b>' + s[1] + '</h2><p>' + s[2] + '</p></div></div>' +
      '<div class="lock"><svg viewBox="0 0 100 100">' + u + '</svg><div><div class="nm">신우코맥스</div><div class="tg">' + TAG + '</div></div></div>' +
      '<div class="uses"><div class="rev"><svg viewBox="0 0 100 100">' + u + '</svg><b>신우코맥스</b></div>' +
      '<div class="icon"><svg viewBox="0 0 100 100">' + u + '</svg></div></div>' +
      '</article>';
  }).join("");
  document.getElementById("grid").innerHTML = html;
</script>
</body>
</html>
